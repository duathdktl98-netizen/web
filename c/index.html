<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C유형 와이어프레임</title>
  <link rel="stylesheet" href="css/styel.css">
  <script src="js/script.js"></script>
</head>
<body>
  <div class="container">
    <!-- 로고,메뉴 -->
    <header>
      <h1 class="logo-box"><a href="#"></a>logo</h1>
      <nav class="menu-box">
        <ul>메뉴</ul>
      </nav>
    </header>
    <!-- 메인,푸터 -->
    <div class="r-box">
      <!-- 슬라이드,컨텐츠 -->
      <main>
        <div class="slide">슬라이드</div>
        <div class="contents">
          <div class="notice">공지</div>
          <div class="gallary">갤</div>
          <div class="banner">배너</div>
        </div>
      </main>
      
      <!-- 로고,하단메뉴,카피라이트 -->
      <footer>
        <div class="ft-logo"><a href="#">로고</a></div>
        <div class="ft-box">
          <div class="ft-menu">
            <ul>하단메뉴</ul>
          </div>
          <div class="copy">카피라이트</div>
        </div>
      </footer>
    </div>
  </div>
</body>
</html>
